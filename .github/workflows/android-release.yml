name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "是否构建签名 Release APK/AAB"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  release-build:
    name: 构建签名 Release APK
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && inputs.build_release == 'true')
    timeout-minutes: 20

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 还原签名证书（缺失则自动生成临时密钥）
        run: |
          mkdir -p app/release
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "使用已配置的签名密钥"
            printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release/highlight-reader-release.jks
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "未检测到签名密钥 Secrets，自动生成临时签名密钥"
            keytool -genkeypair -v \
              -keystore app/release/highlight-reader-release.jks \
              -alias highlight-reader \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass highlight-reader-auto \
              -keypass highlight-reader-auto \
              -dname "CN=highlight-reader, OU=auto, O=auto, L=auto, S=auto, C=CN"
            echo "ANDROID_KEYSTORE_PASSWORD=highlight-reader-auto" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=highlight-reader" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=highlight-reader-auto" >> $GITHUB_ENV
          fi
          echo "ANDROID_KEYSTORE_FILE=release/highlight-reader-release.jks" >> $GITHUB_ENV
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 构建 Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 获取版本号
        id: get_version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 上传 Artifact（国内下载快）
        uses: actions/upload-artifact@v4
        with:
          name: highlight-reader-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}-${{ github.run_number }}
          name: "v${{ steps.get_version.outputs.version }} (Build #${{ github.run_number }})"
          body: |
            构建编号: ${{ github.run_number }}
            提交: ${{ github.sha }}
            
            国内用户建议从 Actions 页面下载 Artifact，速度更快。
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}