name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "是否构建签名 Release APK/AAB"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  release-build:
    name: 构建签名 Release APK
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && inputs.build_release == 'true')
    timeout-minutes: 20

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 还原签名证书
        run: |
          mkdir -p app/release
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release/highlight-reader-release.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: 构建 Release APK
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          ANDROID_KEYSTORE_FILE: release/highlight-reader-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 获取版本号
        id: get_version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}-${{ github.run_number }}
          name: "v${{ steps.get_version.outputs.version }} (Build #${{ github.run_number }})"
          body: |
            构建编号: ${{ github.run_number }}
            提交: ${{ github.sha }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}